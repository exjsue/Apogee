<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Apogee</title>
<link rel="icon" href="data:,">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="stylesheet" href="./src/ui/app.css">
</head>
<body>
<div id="app">
  <noscript><p>Apogee needs JavaScript to run. It stores your data only on this device.</p></noscript>
  <p class="muted loading">Loading…</p>
</div>
<!-- The rest-timer icon, cloned by src/ui/set-rows.js (a ring and a pie; the pie's path is set by script). -->
<template id="rest-icon-template"><svg class="rest-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle class="rest-ring" cx="12" cy="12" r="10.5"></circle><path class="rest-pie" d=""></path></svg></template>
<!-- The Body tab's diagram, cloned by src/ui/body-diagram.js, which adds the regions (same reason as the rest icon above). -->
<template id="body-diagram-template"><svg class="body-diagram" focusable="false"></svg></template>
<script type="module" src="./src/ui/main.js"></script>
</body>
</html>
